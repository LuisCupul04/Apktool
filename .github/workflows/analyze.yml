name: Analyze
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: ${{ secrets.EXTEN_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          # Eliminamos gradle-home-cache-cleanup para usar el valor por defecto (never)
          # Esto evita el fallo de limpieza y la advertencia de deprecación
        continue-on-error: true  # Si aún falla, no detiene el workflow

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: none        # Cambiado de 'manual' a 'none' (elimina el aviso de overlay)
          config: |
            paths-ignore:
              - '**/test/**'

      - name: Build with Gradle
        run: |
          ./gradlew clean testClasses \
            -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
          ORG_GRADLE_PROJECT_dependencyVerification: off

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
