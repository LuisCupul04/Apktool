name: CI
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '**.java'
      - '**.kts'
      - 'brut.apktool/apktool-lib/src/main/resources/**'
      - 'brut.apktool/apktool-lib/src/test/**'
      - '.github/workflows/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BINARY_PATH: brut.apktool/apktool-lib/src/main/resources/prebuilt

jobs:
  analyze-mac-aapt:
    runs-on: macos-latest
    strategy:
      matrix:
        file: [ aapt_64, aapt2_64 ]
    steps:
      - uses: actions/checkout@v6
      - name: Verify Executable
        run: ${{ env.BINARY_PATH }}/macosx/${{ matrix.file }} version
      - name: Output Static
        run: otool -L ${{ env.BINARY_PATH }}/macosx/${{ matrix.file }} || true

  analyze-linux-aapt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: [ aapt, aapt_64, aapt2, aapt2_64 ]
    steps:
      - uses: actions/checkout@v6
      - name: Verify Executable
        run: ${{ env.BINARY_PATH }}/linux/${{ matrix.file }} version
      - name: Output Static
        run: ldd ${{ env.BINARY_PATH }}/linux/${{ matrix.file }} || true

  analyze-windows-aapt:
    runs-on: windows-latest
    strategy:
      matrix:
        file: [ aapt.exe, aapt_64.exe, aapt2.exe, aapt2_64.exe ]
    steps:
      - uses: actions/checkout@v6
      - name: Verify Executable
        run: ${{ env.BINARY_PATH }}/windows/${{ matrix.file }} version
      - name: Output Static
        run: ldd ${{ env.BINARY_PATH }}/windows/${{ matrix.file }} || true

  # --- JOB PRINCIPAL DE PRUEBAS (CORREGIDO) ---
  build-and-test-with-Java-8-and-later:
    runs-on: ${{ matrix.os }}
    needs: [analyze-mac-aapt, analyze-linux-aapt, analyze-windows-aapt]
    name: Build/Test (JDK ${{ matrix.java }}, ${{ matrix.os }})   # ← SIN ESPACIO EXTRA
    strategy:                                                      # ← MISMA INDENTACIÓN QUE runs-on
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
        java: [ 8, 11, 17, 18, 19, 20 ]
    steps:                                                         # ← MISMA INDENTACIÓN
      - uses: actions/checkout@v6

      - name: Setup JDK ${{ matrix.java }} (for toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: Setup JDK 17 (for Gradle execution)
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 17

      - name: Set MATRIX_JAVA
        run: echo "MATRIX_JAVA=${{ matrix.java }}" >> $GITHUB_ENV
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          cache-cleanup: never
        continue-on-error: true

      - name: Build and test
        shell: bash
        run: |
          ./gradlew build shadowJar proguard \
            -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
          ORG_GRADLE_PROJECT_dependencyVerification: off

  # --- JOB DE SUBIDA DE ARTEFACTO (MEJORADO) ---
  upload-artifact:
    runs-on: ubuntu-latest
    name: Build apktool.jar
    if: github.repository == 'LuisCupul04/Apktool' && github.ref == 'refs/heads/master'
    needs: build-and-test-with-Java-8-and-later
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Instalar JDK 8 para la toolchain (compilación)
      - name: Setup JDK 8 (for toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 8

      # Instalar JDK 17 para ejecutar Gradle
      - name: Setup JDK 17 (for Gradle execution)
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 17

      # Definir variable para que la toolchain use JDK 8
      - name: Set MATRIX_JAVA
        run: echo "MATRIX_JAVA=8" >> $GITHUB_ENV
        shell: bash

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false
          cache-cleanup: never
        continue-on-error: true

      - name: Build
        run: |
          ./gradlew build shadowJar proguard \
            -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
          ORG_GRADLE_PROJECT_dependencyVerification: off

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: apktool.jar
          path: brut.apktool/apktool-cli/build/libs/apktool-*.jar
