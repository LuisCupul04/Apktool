build-and-test-with-Java-8-and-later:
  runs-on: ${{ matrix.os }}
  needs:
    - analyze-mac-aapt
    - analyze-linux-aapt
    - analyze-windows-aapt
  name: Build/Test (JDK ${{ matrix.java }}, ${{ matrix.os }})
  strategy:
    fail-fast: true
    matrix:
      os: [ ubuntu-latest, macOS-latest, windows-latest ]
      java: [ 8, 11, 17, 18, 19, 20 ]
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: ${{ matrix.java }}
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: ${{ secrets.EXTEN_TOKEN }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
        cache-cleanup: never   # <-- Única opción de limpieza (elimina gradle-home-cache-cleanup)

    - name: Build and test
      shell: bash   # <-- Fuerza bash para evitar problemas de sintaxis en Windows
      run: |
        ./gradlew build shadowJar proguard \
          -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
          --no-daemon
      env:
        GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
        ORG_GRADLE_PROJECT_dependencyVerification: off

upload-artifact:
  runs-on: ubuntu-latest
  name: Build apktool.jar
  if: github.repository == 'LuisCupul04/Apktool' && github.ref == 'refs/heads/master'
  needs:
    - build-and-test-with-Java-8-and-later
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: ${{ secrets.EXTEN_TOKEN }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false
        cache-cleanup: never

    - name: Build
      shell: bash
      run: |
        ./gradlew build shadowJar proguard \
          -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
          --no-daemon
      env:
        GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
        ORG_GRADLE_PROJECT_dependencyVerification: off

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: apktool.jar
        path: brut.apktool/apktool-cli/build/libs/apktool-v*
