name: CI
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '**.java'
      - '**.kts'
      - 'brut.apktool/apktool-lib/src/main/resources/**'
      - 'brut.apktool/apktool-lib/src/test/**'
      - '.github/workflows/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BINARY_PATH: brut.apktool/apktool-lib/src/main/resources/prebuilt

jobs:
  analyze-mac-aapt:
    runs-on: macos-latest
    strategy:
      matrix:
        file: [ aapt_64, aapt2_64 ]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Executable
        run: ${{ env.BINARY_PATH }}/macosx/${{ matrix.file }} version
      - name: Output Static
        run: otool -L ${{ env.BINARY_PATH }}/macosx/${{ matrix.file }} || true

  analyze-linux-aapt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: [ aapt, aapt_64, aapt2, aapt2_64 ]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Executable
        run: ${{ env.BINARY_PATH }}/linux/${{ matrix.file }} version
      - name: Output Static
        run: ldd ${{ env.BINARY_PATH }}/linux/${{ matrix.file }} || true

  analyze-windows-aapt:
    runs-on: windows-latest
    strategy:
      matrix:
        file: [ aapt.exe, aapt_64.exe, aapt2.exe, aapt2_64.exe ]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Executable
        run: ${{ env.BINARY_PATH }}/windows/${{ matrix.file }} version
      - name: Output Static
        run: ldd ${{ env.BINARY_PATH }}/windows/${{ matrix.file }} || true

  build-and-test-with-Java-8-and-later:
    runs-on: ${{ matrix.os }}
    needs:
      - analyze-mac-aapt
      - analyze-linux-aapt
      - analyze-windows-aapt
    name: Build/Test (JDK ${{ matrix.java }}, ${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, macOS-latest, windows-latest ]
        java: [ 8, 11, 17, 18, 19, 20 ]
    steps:
      - uses: actions/checkout@v4

      # Setup Java con autenticación para GitHub Packages (útil para Maven, pero también dejamos preparado)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: ${{ secrets.EXTEN_TOKEN }}

      # Configura Gradle con caché y pasa el token
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          cache-cleanup: never   # Evita errores de limpieza en Windows
          gradle-home-cache-cleanup: false

      # Ejecuta build pasando el token explícitamente
      - name: Build and test
        run: |
          ./gradlew build shadowJar proguard \
            -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
          ORG_GRADLE_PROJECT_dependencyVerification: off   # Desactiva verificación de dependencias

  upload-artifact:
    runs-on: ubuntu-latest
    name: Build apktool.jar
    if: github.repository == 'LuisCupul04/Apktool' && github.ref == 'refs/heads/master'
    needs:
      - build-and-test-with-Java-8-and-later
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: ${{ secrets.EXTEN_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false   # En master, queremos guardar caché
          cache-cleanup: never

      - name: Build
        run: |
          ./gradlew build shadowJar proguard \
            -Dorg.gradle.project.githubToken=${{ secrets.EXTEN_TOKEN }} \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
          ORG_GRADLE_PROJECT_dependencyVerification: off

      - name: Upload
        uses: actions/upload-artifact@v4   # Actualizado a v4
        with:
          name: apktool.jar
          path: brut.apktool/apktool-cli/build/libs/apktool-v*
