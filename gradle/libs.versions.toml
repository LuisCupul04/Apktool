[versions]
baksmali = "3.0.9.RE"
commons_io = "2.21.0"
commons_cli = "1.11.0"
commons_lang3 = "3.20.0"
commons_text = "1.15.0"
guava = "33.5.0-jre"
junit = "4.13.2"
proguard = "7.9.0"
smali = "3.0.9.RE"
