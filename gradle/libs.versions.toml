xmlpull = { module = "xpp3:xpp3", version.ref = "xmlpull" }
xmlunit = { module = "org.xmlunit:xmlunit-legacy", version.ref = "xmlunit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" } # <--- NUEVO ID y versión
